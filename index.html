<style>
:root {
  --gold: #c9a84c;

  --banker: #c0392b;
  --banker-glow: #ff6b5b;

  --tie: #1e8c5a;
  --tie-glow: #4de8a0;
  --bg: #0a0a0c;
  --surface: #111118;
  --surface2: #18181f;
  --border: rgba(201,168,76,0.18);
  --text: #e8e0d0;
  --muted: #8a8070;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  position: relative;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select: none;
  user-select: none;
}
/* Subtle felt texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 20% 100%, rgba(26,111,168,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 60% 80% at 80% 100%, rgba(192,57,43,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}
/* Gold diamond pattern */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 40px,
    rgba(201,168,76,0.025) 40px,
    rgba(201,168,76,0.025) 41px
  ),
  repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 40px,
    rgba(201,168,76,0.025) 40px,
    rgba(201,168,76,0.025) 41px
  );
  pointer-events: none;
  z-index: 0;
}
.wrapper {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: 0 20px 40px;
  display: flex;
  flex-direction: column;
}
/* デフォルトの並び順（大路が上、操作部が下） */
.wrapper > header        { order: 1; }
.wrapper > .score-grid   { order: 2; }
.wrapper > .shoe-info    { order: 3; }
.wrapper > .section-history  { order: 4; }
.wrapper > .divider      { order: 5; }
.wrapper > .section-controls { order: 6; }
.wrapper > .section-stats    { order: 7; }
/* レイアウト反転時：操作部を上、大路を下に。stats は常に最下部 */
.wrapper.flipped > .section-controls { order: 4; }
.wrapper.flipped > .section-history  { order: 6; }
.wrapper.flipped > .section-stats    { order: 7; }
/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 0 18px;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dim));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.logo span {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 2px;
  display: block;
  -webkit-text-fill-color: var(--muted);
  color: var(--muted);
  margin-top: -2px;
}
.header-btns { display: flex; gap: 8px; }
#reset-btn, #swap-btn, #sound-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 7px 12px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
}
#reset-btn:hover, #swap-btn:hover, #sound-btn:hover {
  border-color: var(--gold-dim);
  color: var(--gold);
}
#swap-btn { padding: 7px 11px; font-size: 12px; }
#sound-btn { padding: 7px 11px; font-size: 13px; }
#sound-btn.muted { color: #444; border-color: #2a2a2a; }
#rank-btn { padding: 7px 11px; font-size: 13px; }
/* ── モーダル共通 ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.78);
  display: flex; align-items: flex-end; justify-content: center;
}
.modal-sheet {
  background: #18181f;
  border-radius: 18px 18px 0 0;
  padding: 24px 20px 44px;
  width: 100%; max-width: 520px;
  border-top: 1px solid rgba(201,168,76,0.2);
  max-height: 82vh; overflow-y: auto;
}
.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 3px; color: var(--gold-light);
}
/* ── ランキング ── */
.rank-tabs { display: flex; gap: 8px; margin: 14px 0 12px; }
.rank-tab {
  flex: 1; padding: 8px 4px;
  font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 2px;
  border: 1px solid var(--border); border-radius: 6px;
  background: transparent; color: var(--muted); cursor: pointer;
  transition: all 0.2s; text-transform: uppercase;
}
.rank-tab.active { border-color: var(--gold-dim); color: var(--gold); }
.rank-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 6px;
  border-bottom: 1px solid rgba(201,168,76,0.05);
}
.rank-row.rank-mine { background: rgba(201,168,76,0.06); border-radius: 4px; }
.rank-pos { width: 28px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gold-dim); text-align: center; }
.rank-pos.top3 { font-size: 16px; }
.rank-name { flex: 1; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-val { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; line-height: 1; }
.rank-val.sv { color: var(--banker-glow); }
.rank-val.cv { color: var(--player-glow); }
/* ── ニックネーム入力 ── */
.nick-input {
  width: 100%; padding: 13px;
  background: #111118; border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: 'DM Mono', monospace; font-size: 15px;
  outline: none; box-sizing: border-box; margin: 14px 0;
}
.nick-input:focus { border-color: var(--gold-dim); }
.modal-btn-row { display: flex; gap: 8px; margin-top: 4px; }
.modal-btn {
  flex: 1; padding: 12px;
  border-radius: 8px; font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px; cursor: pointer; transition: all 0.2s;
}
.modal-btn.cancel { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); }
.modal-btn.confirm { flex: 2; background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.4); color: var(--gold); }
/* ── Score Panel ── */
.score-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin: 24px 0;
}
.score-cell {
  background: var(--surface);
  padding: 14px 10px;
  text-align: center;
}
.score-cell .label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.score-cell .value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 1px;
  color: var(--gold-light);
  line-height: 1;
  transition: transform 0.15s, color 0.2s;
}
.score-cell.highlight .value {
  color: #fff;
}
/* ── Flash Message ── */
#flash-wrap {
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 2px 0 4px;
}
#flash {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 34px;
  letter-spacing: 5px;
  line-height: 1;
  opacity: 0;
  transform: scale(0.8) translateY(2px);
  transition: opacity 0.1s, transform 0.1s;
}
#flash.show {
  opacity: 1;
  transform: scale(1) translateY(0);
}
#flash.hit { color: var(--gold-light); text-shadow: 0 0 30px rgba(232,201,122,0.7); }
#flash.miss { color: #e05c5c; text-shadow: 0 0 30px rgba(224,92,92,0.5); }
#flash.tie { color: var(--tie-glow); text-shadow: 0 0 30px rgba(77,232,160,0.5); }
/* ── Buttons ── */
.btn-row {
  display: grid;
  grid-template-columns: 1fr 0.65fr 1fr;
  gap: 12px;
  margin: 8px 0 28px;
}
.bet-btn {
  position: relative;
  background: var(--surface2);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 22px 10px 18px;
  cursor: pointer;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.5);
  overflow: hidden;
  transition: transform 0.12s, border-color 0.2s;
  outline: none;
  -webkit-touch-callout: none;
}
.bet-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.25s;
}
.bet-btn:hover { transform: translateY(-2px); }
.bet-btn:active { transform: scale(0.96); }
/* Player */
.btn-p { border-top: 3px solid var(--player); }
.btn-p::before { background: linear-gradient(160deg, rgba(26,111,168,0.3), transparent 60%); }
.btn-p:hover { border-color: var(--player-glow); color: var(--player-glow); }
.btn-p:hover::before { opacity: 1; }
.btn-p .btn-icon { color: var(--player); }
/* Tie */
.btn-t { border-top: 3px solid var(--tie); }
.btn-t::before { background: linear-gradient(160deg, rgba(30,140,90,0.3), transparent 60%); }
.btn-t:hover { border-color: var(--tie-glow); color: var(--tie-glow); }
.btn-t:hover::before { opacity: 1; }
.btn-t .btn-icon { color: var(--tie); }
/* Banker */
.btn-b { border-top: 3px solid var(--banker); }
.btn-b::before { background: linear-gradient(160deg, rgba(192,57,43,0.3), transparent 60%); }
.btn-b:hover { border-color: var(--banker-glow); color: var(--banker-glow); }
.btn-b:hover::before { opacity: 1; }
.btn-b .btn-icon { color: var(--banker); }
.btn-icon {
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 1px;
  display: block;
  margin-bottom: 6px;
  transition: color 0.2s;
}
.bet-btn span.main {
  display: block;
  position: relative;
  z-index: 1;
}
/* Active press ripple */
.bet-btn.pressed::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.07);
  border-radius: inherit;
  animation: pressFlash 0.3s ease-out forwards;
}
@keyframes pressFlash {
  0% { opacity: 1; }
  100% { opacity: 0; }
}
/* ── Odds display ── */
.odds-row {
  display: grid;
  grid-template-columns: 1fr 0.65fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.odds-chip {
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--muted);
  padding: 4px 0;
}
/* ── History ── */
.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.history-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}
#history-count {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold-dim);
}
/* ── Big Road（大路）─── */
#history {
  --cell: 22px;
  display: grid;
  grid-template-rows: repeat(6, var(--cell));
  grid-auto-flow: column;
  grid-auto-columns: var(--cell);
  gap: 1px;
  padding: 6px 112px 6px 6px;
  background: #08080a;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;
  min-height: calc(var(--cell) * 6 + 14px);
}
/* 出目集計パネル */
.history-wrap { position: relative; }
#road-stats-panel {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 112px;
  background: linear-gradient(to right, transparent, rgba(8,8,10,0.97) 28%);
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: flex-end;
  padding: 8px 10px 8px 0;
  pointer-events: none;
  border-radius: 0 6px 6px 0;
}
.rsp-row { display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
.rsp-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 7px; letter-spacing: 1.5px;
  color: var(--muted); text-transform: uppercase;
}
.rsp-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px; line-height: 1; letter-spacing: 1px;
}
.rsp-pct {
  font-family: 'DM Mono', monospace;
  font-size: 9px; color: var(--muted); margin-top: -1px;
}
.rsp-b .rsp-val { color: var(--banker-glow); }
.rsp-p .rsp-val { color: var(--player-glow); }
.rsp-t .rsp-val { color: var(--tie-glow); }
#history::-webkit-scrollbar { height: 4px; }
#history::-webkit-scrollbar-track { background: transparent; }
#history::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); border-radius: 2px; }
.br-cell {
  position: relative;
  width: var(--cell);
  height: var(--cell);
  display: flex;
  align-items: center;
  justify-content: center;
}
.br-cell::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 2px solid currentColor;
  background: transparent;
  box-sizing: border-box;
}
.br-b { color: var(--banker); }
.br-p { color: var(--player); }
.br-b::before { box-shadow: 0 0 6px rgba(192,57,43,0.45), inset 0 0 4px rgba(192,57,43,0.25); }
.br-p::before { box-shadow: 0 0 6px rgba(26,111,168,0.45), inset 0 0 4px rgba(26,111,168,0.25); }
.br-cell .tie-slash {
  position: absolute;
  width: 80%;
  height: 2px;
  background: var(--tie-glow);
  transform: rotate(-45deg);
  box-shadow: 0 0 5px rgba(77,232,160,0.6);
  border-radius: 1px;
  z-index: 2;
}
.br-cell .tie-num {
  position: absolute;
  bottom: -1px;
  right: -1px;
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--tie-glow);
  line-height: 1;
  z-index: 3;
  text-shadow: 0 0 3px rgba(0,0,0,0.9);
}
.br-cell.new::before {
  animation: dotPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes dotPop {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.br-empty {
  grid-row: 1 / span 6;
  grid-column: 1 / span 6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold-dim);
  letter-spacing: 4px;
}
/* ── Bet Wheel ── */
.bet-wheel-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 4px 0 12px;
}
.bet-wheel-container {
  position: relative;
  height: 48px;
  width: 130px;
  overflow: hidden;
}
.bet-wheel-container::before,
.bet-wheel-container::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 14px;
  z-index: 2;
  pointer-events: none;
}
.bet-wheel-container::before {
  top: 0;
  background: linear-gradient(to bottom, var(--bg), transparent);
}
.bet-wheel-container::after {
  bottom: 0;
  background: linear-gradient(to top, var(--bg), transparent);
}
.bet-wheel {
  height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.bet-wheel::-webkit-scrollbar { display: none; }
.bet-wheel-item {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  scroll-snap-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 2px;
  color: var(--muted);
  transition: color 0.2s;
  cursor: pointer;
}
.bet-wheel-item.active { color: var(--gold-light); }
.bet-wheel-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
}
/* ロック状態 */
.bet-wheel-wrap.locked .bet-wheel { pointer-events: none; }
.bet-wheel-wrap.locked .bet-wheel-item { color: rgba(255,255,255,0.15); }
.bet-wheel-wrap.locked .bet-wheel-item.active { color: rgba(255,255,255,0.25); }
.bet-unlock-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  cursor: pointer;

<script>
let score = 0, combo = 0, history = [], locked = false, current = null;
let userHistory = []; // {bet, result, outcome, delta, total}
let best = Number(localStorage.getItem('baccarat_best') || 0);
let bestCombo = Number(localStorage.getItem('baccarat_best_combo') || 0);
const MAX_COMBO_BAR = 10;
let lastPTotal = null, lastBTotal = null, lastIsNatural = false;

// === Web Audio API（低遅延）===
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const audioBuffers = {};
async function loadSfx(name, url) {
  try {
    const res = await fetch(url);
    const ab = await res.arrayBuffer();
    audioBuffers[name] = await audioCtx.decodeAudioData(ab);
  } catch(e) {}
}
let soundEnabled = localStorage.getItem('bbr_sound') !== 'off';
function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem('bbr_sound', soundEnabled ? 'on' : 'off');
  const btn = document.getElementById('sound-btn');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  btn.classList.toggle('muted', !soundEnabled);
}
// 初期状態を反映
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('sound-btn');
  if (!soundEnabled) { btn.textContent = '🔇'; btn.classList.add('muted'); }
});

async function playSfx(name) {
  if (!soundEnabled) return;
  const buf = audioBuffers[name];
  if (!buf) return;
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(0);
}
loadSfx('natural9', 'naturalnine.mp3');
loadSfx('natural8', 'naturaleight.mp3');
loadSfx('tie', 'tie.mp3');

// === GoatCounter カスタムイベント ===
function trackEvent(name) {
  if (window.goatcounter && window.goatcounter.count) {
    try { window.goatcounter.count({ path: name, event: true }); } catch(e) {}
  }
}
let firstTapTracked = false;
let install100Tracked = false, install500Tracked = false;
// PWAとして起動されたかを判定して送る（最初の1回だけ）
window.addEventListener('load', () => {
  loadAd();
  initBetWheel();
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  setTimeout(() => trackEvent(isStandalone ? 'launch-pwa' : 'launch-browser'), 800);
});
// インストール完了イベント（Android Chrome等で発火、iOS非対応）
window.addEventListener('appinstalled', () => trackEvent('pwa-installed'));

// === Bet & payout config ===
let currentBet = 100;
const BET_OPTIONS = [100, 200, 300, 400, 500];
const PAYOUT = { B: 1, P: 1, T: 8 }; // 1倍 = +100, 8倍 = +800

// === Bet Wheel ===
const UNLOCK_DELAY_MS = 24 * 60 * 60 * 1000; // 24時間
let betUnlocked = localStorage.getItem('bet_unlocked') === 'true';

function initBetWheel() {
  const wheel = document.getElementById('bet-wheel');
  const wrap = document.getElementById('bet-wheel-wrap');
  const unlockBtn = document.getElementById('bet-unlock-btn');

  // シェア済みで24時間経過していればアンロック
  if (!betUnlocked) {
    const shareTime = Number(localStorage.getItem('bet_share_time') || 0);
    if (shareTime && Date.now() - shareTime >= UNLOCK_DELAY_MS) {
      betUnlocked = true;
      localStorage.setItem('bet_unlocked', 'true');
    }
  }

  if (betUnlocked) {
    wrap.classList.remove('locked');
    unlockBtn.classList.add('hidden');
  }

  wheel.addEventListener('scroll', () => {
    const itemH = 48;
    const idx = Math.round(wheel.scrollTop / itemH);
    const realIdx = Math.min(Math.max(idx, 0), BET_OPTIONS.length - 1);
    currentBet = BET_OPTIONS[realIdx];
    document.querySelectorAll('.bet-wheel-item').forEach((el, i) => {
      el.classList.toggle('active', i === realIdx + 1);
    });
  }, { passive: true });

// === Shoe (6デック=312枚) ===
const NUM_DECKS = 6;
const SHOE_SIZE = NUM_DECKS * 52; // 312
const CUT_THRESHOLD = 14; // 残りこの枚数を下回ったら新シューに（実カジノ準拠）
let shoe = [];
let shoeNumber = 0;

function buildShoe() {
  // バカラのカード値: A=1, 2-9=ピップ, 10/J/Q/K=0
  const deck = [];
  for (let d = 0; d < NUM_DECKS; d++) {
    for (let suit = 0; suit < 4; suit++) {
      deck.push(1);                              // A
      for (let v = 2; v <= 9; v++) deck.push(v); // 2-9
      deck.push(0); deck.push(0); deck.push(0); deck.push(0); // 10,J,Q,K
    }
  }
  // Fisher-Yates シャッフル
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function newShoe(flash = false) {
  shoe = buildShoe();
  shoeNumber++;
  updateShoeUI();
  if (flash) {
    history = [];

    info.classList.add('flash');

function dealHand() {
  // 残り少なければ自動で新シュー
  if (shoe.length < CUT_THRESHOLD) newShoe(true);

  const p1 = shoe.pop(), b1 = shoe.pop();
  const p2 = shoe.pop(), b2 = shoe.pop();
  let pTotal = (p1 + p2) % 10;
  let bTotal = (b1 + b2) % 10;
  const isNatural = pTotal >= 8 || bTotal >= 8;

  // ナチュラル（8 or 9）が出たら追加カードなし
  if (!isNatural) {
    let p3 = null;
    // プレイヤー第3カードルール: 0-5でヒット、6-7でスタンド
    if (pTotal <= 5) {
      p3 = shoe.pop();
      pTotal = (pTotal + p3) % 10;
    }
    // バンカー第3カードルール（Tableau）
    if (p3 === null) {
      // プレイヤーがスタンドした場合: バンカーは0-5でヒット
      if (bTotal <= 5) {
        const b3 = shoe.pop();
        bTotal = (bTotal + b3) % 10;
      }
    } else {
      // プレイヤーがヒットした場合: バンカーの合計とp3に応じて判定
      let bDraw = false;
      if (bTotal <= 2) bDraw = true;
      else if (bTotal === 3) bDraw = (p3 !== 8);
      else if (bTotal === 4) bDraw = (p3 >= 2 && p3 <= 7);
      else if (bTotal === 5) bDraw = (p3 >= 4 && p3 <= 7);
      else if (bTotal === 6) bDraw = (p3 === 6 || p3 === 7);
      // bTotal === 7 はスタンド
      if (bDraw) {
        const b3 = shoe.pop();
        bTotal = (bTotal + b3) % 10;
      }
    }
  }

  updateShoeUI();
  const winner = pTotal > bTotal ? 'P' : bTotal > pTotal ? 'B' : 'T';
  return { winner, pTotal, bTotal, isNatural };
}

// === 連打対応 ===
const COOLDOWN_MS = 200;     // 次のハンドまでの間隔
const QUEUE_MAX = 5;          // ロック中に溜められる入力数
const inputQueue = [];

function hit(input) {
  if (locked) {
    // 処理中はキューに積む（あふれたら破棄）
    if (inputQueue.length < QUEUE_MAX) inputQueue.push(input);
    return;
  }
  if (!current) return;
  if (!firstTapTracked) { firstTapTracked = true; trackEvent('first-tap'); }
  evaluate(input);
}

function evaluate(input) {
  locked = true;
  const isTieCombo = input === 'TB' || input === 'TP';
  const btn = document.querySelector((input === 'T' || isTieCombo) ? '.btn-t' : input === 'P' ? '.btn-p' : '.btn-b');
  // pressed クラスを毎回付け直してアニメーションを再トリガー
  btn.classList.remove('pressed');
  void btn.offsetWidth;
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 200);

  let outcome, delta;
  if (isTieCombo) {
    const sideBet = input === 'TB' ? 'B' : 'P';
    if (current === 'T') {
      // TIE的中: TIE +8x、サイドはプッシュ
      delta = currentBet * 8;
      outcome = 'HIT';
      score += delta;
      combo++;
      showFlash('+' + delta, 'hit');
      playSfx('tie');
      vibrate([0, 25, 30, 25, 30, 40]);
    } else if (current === sideBet) {
      // サイド的中: TIEは負け、サイドは勝ち → 相殺でゼロ
      delta = 0;
      outcome = 'PUSH';
      showFlash('PUSH', 'tie');
      vibrate(20);
    } else {
      // 両方外れ: TIE + サイド 合計 -2x
      delta = -(currentBet * 2);
      outcome = 'MISS';
      score += delta;
      combo = 0;
      showFlash('-' + (currentBet * 2), 'miss');
      vibrate([0, 30, 40, 30]);
    }
  } else if (input === current) {
    // 当たり: ベット額 × 倍率
    delta = currentBet * PAYOUT[current];
    outcome = 'HIT';
    score += delta;
    combo++;
    if (current === 'T') {
      showFlash('+' + delta, 'hit');
      playSfx('tie');
      vibrate([0, 25, 30, 25, 30, 40]);
    } else {
      if (lastIsNatural) {
        const winTotal = input === 'P' ? lastPTotal : lastBTotal;
        if (winTotal === 9) { playSfx('natural9'); }
        else if (winTotal === 8) { playSfx('natural8'); }
      }
      showFlash('HIT', 'hit');
      vibrate(15);
    }
  } else if (current === 'T' && (input === 'P' || input === 'B')) {
    // プッシュ: P/Bに賭けてTie結果が出た → 賭け金返却。スコア変動なし、コンボは維持
    delta = 0;
    outcome = 'PUSH';
    playSfx('tie');
    showFlash('PUSH', 'tie');
    vibrate(20);
  } else {
    // 外れ: ベット額没収
    delta = -currentBet;
    outcome = 'MISS';
    score += delta;
    combo = 0;
    showFlash('MISS', 'miss');
    vibrate([0, 30, 40, 30]);
  }
  showBtnScores(lastPTotal, lastBTotal);
  let newBest = false;
  if (score > best) { best = score; localStorage.setItem('baccarat_best', best); newBest = true; }
  if (combo > bestCombo) { bestCombo = combo; localStorage.setItem('baccarat_best_combo', bestCombo); newBest = true; }
  if (newBest) submitRanking();
  history.push(current);
  userHistory.push({ bet: input, result: current, outcome, delta, total: score, pTotal: lastPTotal, bTotal: lastBTotal });
  // 節目イベント（深いエンゲージメント指標）
  if (!install100Tracked && history.length === 100) { install100Tracked = true; trackEvent('rounds-100'); }
  if (!install500Tracked && history.length === 500) { install500Tracked = true; trackEvent('rounds-500'); }
  update();
  renderHistory();
  renderStats();

  setTimeout(() => {
    next();
    // キューに残ってたら即座に次を処理
    if (inputQueue.length > 0 && current) {
      const q = inputQueue.shift();
      evaluate(q);
    }
  }, COOLDOWN_MS);
}

// === Big Road（大路）算出 ===
// 同じ結果が続けば下へ、最下段に到達したら同じ行で右へ（dragon tail = 龍尾）。
// 結果が変わったときは「ストリークが開始した列 + 1」の最上段から新しい列を始める
// （龍尾が右へ伸びていてもジャンプせず、龍尾の上に新しい列を重ねる）。
// TIE は直前の B/P セルに緑のスラッシュとして重ねる。
function buildBigRoad(hist) {
  const ROWS = 6;
  const cells = [];
  const occupied = new Set(); // "row,col"
  let last = null;
  let streakStartCol = 0; // 現在のストリークが始まった列
  let pendingTies = 0;
  const key = (r, c) => r + ',' + c;

  for (const res of hist) {
    if (res === 'T') {
      if (last) last.ties++;
      else pendingTies++;
      continue;
    }
    if (!last) {
      const cell = { row: 0, col: 0, result: res, ties: pendingTies };
      cells.push(cell);
      occupied.add(key(0, 0));
      last = cell;
      streakStartCol = 0;
      pendingTies = 0;
    } else if (last.result === res) {
      // 同じ結果 → まず真下を試す。塞がっていれば同じ行で右へ（龍尾）
      let r = last.row + 1, c = last.col;
      if (r >= ROWS || occupied.has(key(r, c))) {
        r = last.row;
        c = last.col + 1;
        while (occupied.has(key(r, c))) c++;
      }
      const cell = { row: r, col: c, result: res, ties: 0 };
      cells.push(cell);
      occupied.add(key(r, c));
      last = cell;
      // streakStartCol は据え置き
    } else {
      // 結果が変わった → ストリーク開始列の隣（streakStartCol + 1）の最上段
      let r = 0, c = streakStartCol + 1;
      // 万一そこが既に埋まっていれば右へずらす（防御的）
      while (occupied.has(key(r, c))) c++;
      const cell = { row: r, col: c, result: res, ties: 0 };
      cells.push(cell);
      occupied.add(key(r, c));
      last = cell;
      streakStartCol = c;
    }
  }
  return cells;
}

function renderHistory() {
  const el = document.getElementById('history');
  el.innerHTML = '';
  document.getElementById('history-count').textContent = history.length + ' rounds';

  const cells = buildBigRoad(history);
  if (cells.length === 0) {
    const placeholder = document.createElement('div');
    placeholder.className = 'br-empty';
    placeholder.textContent = '— start —';
    el.appendChild(placeholder);
    renderRoadStats();
    return;
  }

  cells.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'br-cell br-' + c.result.toLowerCase();
    div.style.gridRow = (c.row + 1);
    div.style.gridColumn = (c.col + 1);

        div.appendChild(num);
      }
    }
    if (idx === cells.length - 1) div.classList.add('new');
    el.appendChild(div);
  });

  // 右端まで自動スクロール（padding-right分でパネルの左に止まる）

}

  el.innerHTML = '';
  const glyph = { HIT: '●', MISS: '✕', PUSH: 'ー' };
  for (let i = showFrom; i < userHistory.length; i++) {
    const d = userHistory[i];
    const row = document.createElement('div');
    row.className = 'hist-row';
    if (i === userHistory.length - 1) row.classList.add('new');

    const round = document.createElement('span');
    round.className = 'hist-round';
    round.textContent = '#' + (i + 1);

    const bet = document.createElement('span');
    bet.className = 'hist-bet b-' + d.bet.toLowerCase();
    bet.textContent = d.bet;

    const arrow = document.createElement('span');
    arrow.className = 'hist-arrow';
    arrow.textContent = '→';

    const result = document.createElement('span');
    result.className = 'hist-result r-' + d.outcome.toLowerCase();
    result.textContent = glyph[d.outcome];

    const delta = document.createElement('span');
    let cls = 'hist-delta ';
    if (d.delta > 0) cls += 'd-gain';
    else if (d.delta < 0) cls += 'd-loss';
    else cls += 'd-push';
    delta.className = cls;
    delta.textContent = d.delta === 0 ? '±0' : (d.delta > 0 ? '+' : '') + d.delta;

    const sc = document.createElement('span');
    sc.className = 'hist-score';
    const pSpan = document.createElement('span');
    pSpan.className = 'hs-p';
    pSpan.textContent = d.pTotal ?? '-';
    const bSpan = document.createElement('span');
    bSpan.className = 'hs-b';
    bSpan.textContent = d.bTotal ?? '-';
    sc.append(pSpan, ':', bSpan);

    row.append(round, bet, sc, arrow, result, delta);
    el.appendChild(row);
  }
  // 最新が下端 → 最下部までスクロール
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function renderScoreChart() {
  const W = 320, H = 100, padX = 6, padY = 8;
  const drawW = W - padX * 2;
  const drawH = H - padY * 2;
  const fillEl = document.getElementById('score-fill');
  const lineEl = document.getElementById('score-line');
  const zeroEl = document.getElementById('score-zero');
  const trendEl = document.getElementById('trend-current');

  if (userHistory.length === 0) {
    fillEl.setAttribute('points', '');
    lineEl.setAttribute('points', '');
    const baseY = (padY + drawH).toFixed(1);
    zeroEl.setAttribute('y1', baseY);
    zeroEl.setAttribute('y2', baseY);
    trendEl.textContent = '0';
    trendEl.classList.remove('neg');
    return;
  }
  // 折れ線は直近120ラウンドだけ表示（圧縮しすぎず読めるように）
  const data = userHistory.slice(-120);
  const scores = data.map(d => d.total);
  const minS = Math.min(0, ...scores);
  const maxS = Math.max(0, ...scores);
  const range = (maxS - minS) || 100;

  const xs = data.map((_, i) => padX + (data.length === 1 ? drawW / 2 : (i / (data.length - 1)) * drawW));
  const ys = data.map(d => padY + drawH - ((d.total - minS) / range) * drawH);
  const points = xs.map((x, i) => x.toFixed(1) + ',' + ys[i].toFixed(1)).join(' ');
  const baseY = padY + drawH - ((0 - minS) / range) * drawH;
  const fillPoints = xs[0].toFixed(1) + ',' + baseY.toFixed(1) + ' ' + points + ' ' + xs[xs.length - 1].toFixed(1) + ',' + baseY.toFixed(1);

  lineEl.setAttribute('points', points);
  fillEl.setAttribute('points', fillPoints);
  zeroEl.setAttribute('y1', baseY.toFixed(1));
  zeroEl.setAttribute('y2', baseY.toFixed(1));

  const cur = scores[scores.length - 1];
  trendEl.textContent = (cur > 0 ? '+' : '') + cur.toLocaleString();
  trendEl.classList.toggle('neg', cur < 0);
}

function renderChartStats() {
  const total = userHistory.length;
  const hits = userHistory.filter(d => d.outcome === 'HIT').length;
  const max = userHistory.length ? Math.max(0, ...userHistory.map(d => d.total)) : 0;
  const min = userHistory.length ? Math.min(0, ...userHistory.map(d => d.total)) : 0;
  document.getElementById('stat-hit').textContent = hits;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-max').textContent = (max > 0 ? '+' : '') + max.toLocaleString();
  document.getElementById('stat-min').textContent = min < 0 ? min.toLocaleString() : '0';
}

function getUID() {
  let uid = localStorage.getItem('bbr_uid');
  if (!uid) { uid = ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)); localStorage.setItem('bbr_uid', uid); }
  return uid;
}
function getNickname() {
  let nn = localStorage.getItem('bbr_nickname');
  if (!nn) {
    nn = 'Guest-' + Math.random().toString(36).slice(2, 6).toUpperCase();
    localStorage.setItem('bbr_nickname', nn);
  }
  return nn;
}
function saveNick() {
  const val = (document.getElementById('nick-input')?.value || '').trim().slice(0, 12);
  if (!val) { alert('ニックネームを入力してください'); return; }
  localStorage.setItem('bbr_nickname', val);
  document.getElementById('nick-overlay')?.remove();
  if (window._nickCb) { const cb = window._nickCb; window._nickCb = null; cb(); }
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function submitRanking() {
  if (!db || !getNickname() || history.length < 10) return;
  const uid = getUID(), nn = getNickname(), ts = firebase.firestore.FieldValue.serverTimestamp();
  try {
    if (score > 0) await db.collection('score_ranking').doc(uid).set({ nickname: nn, score, rounds: history.length, updatedAt: ts }, { merge: true });
    if (bestCombo > 0) await db.collection('combo_ranking').doc(uid).set({ nickname: nn, combo: bestCombo, updatedAt: ts }, { merge: true });
  } catch(e) {}
}

let rankTab = 'score';

async function switchRankTab(tab) {
  rankTab = tab;
  document.getElementById('tab-score')?.classList.toggle('active', tab === 'score');
  document.getElementById('tab-combo')?.classList.toggle('active', tab === 'combo');
  await loadRankList();
}
async function loadRankList() {
  const el = document.getElementById('rank-list');
  if (!el) return;
  const empty = msg => `<div style="text-align:center;padding:36px;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)">${msg}</div>`;
  if (!db) { el.innerHTML = empty('オフライン'); return; }
  el.innerHTML = empty('読み込み中...');
  try {
    const col = rankTab === 'score' ? 'score_ranking' : 'combo_ranking';
    const field = rankTab === 'score' ? 'score' : 'combo';
    const snap = await db.collection(col).orderBy(field, 'desc').limit(10).get();
    const uid = getUID();
    const medals = ['🥇','🥈','🥉'];
    if (snap.empty) { el.innerHTML = empty('まだ記録なし'); return; }
    el.innerHTML = snap.docs.map((doc, i) => {
      const d = doc.data(), isMe = doc.id === uid;
      const val = rankTab === 'score' ? Number(d.score).toLocaleString() : d.combo;
      const cls = rankTab === 'score' ? 'sv' : 'cv';
      return `<div class="rank-row${isMe ? ' rank-mine' : ''}">
        <span class="rank-pos${i < 3 ? ' top3' : ''}">${i < 3 ? medals[i] : i+1}</span>
        <span class="rank-name">${esc(d.nickname)}${isMe ? ' 👤' : ''}</span>
        <span class="rank-val ${cls}">${val}</span>
      </div>`;
    }).join('');
  } catch(e) { el.innerHTML = empty('読み込みエラー'); }
}
function showNicknameModal(cb) {
  document.getElementById('nick-overlay')?.remove();
  window._nickCb = cb || null;
  const cur = getNickname();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay'; ov.id = 'nick-overlay';
  ov.innerHTML = `<div class="modal-sheet">

    <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:8px;letter-spacing:1px">ランキングに表示される名前（最大12文字）</div>
    <input id="nick-input" class="nick-input" type="text" maxlength="12" placeholder="例：みやもと" value="${esc(cur)}">
    <div class="modal-btn-row">
      <button class="modal-btn cancel" onclick="document.getElementById('nick-overlay').remove()">キャンセル</button>
      <button class="modal-btn confirm" onclick="saveNick()">保存して続ける</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  setTimeout(() => document.getElementById('nick-input')?.focus(), 50);
}

function resetGame() {
  score = 0; combo = 0; history = []; locked = false; current = null;
  userHistory = [];

  inputQueue.length = 0;
  if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }
  if (scoreTimer) { clearTimeout(scoreTimer); scoreTimer = null; }
  document.getElementById('score-p').classList.remove('show');
  document.getElementById('score-b').classList.remove('show');
  newShoe(false);
  update(); renderHistory(); renderStats();
  document.getElementById('flash').className = '';
  document.getElementById('streakFill').style.width = '0%';
  setTimeout(next, 500);
}
