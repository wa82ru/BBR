<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Baccarat Rhythm</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baccarat">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<!-- GoatCounter アクセス解析（PV、地域、リファラ） -->
<script data-goatcounter="https://countb.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
:root {
  --gold: #c9a84c;
  --gold-light: #e8c97a;
  --gold-dim: #7a6230;
  --banker: #c0392b;
  --banker-glow: #ff6b5b;
  --player: #1a6fa8;
  --player-glow: #5ab3f5;
  --tie: #1e8c5a;
  --tie-glow: #4de8a0;
  --bg: #0a0a0c;
  --surface: #111118;
  --surface2: #18181f;
  --border: rgba(201,168,76,0.18);
  --text: #e8e0d0;
  --muted: #8a8070;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  position: relative;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select: none;
  user-select: none;
}
/* Subtle felt texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 20% 100%, rgba(26,111,168,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 60% 80% at 80% 100%, rgba(192,57,43,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}
/* Gold diamond pattern */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 40px,
    rgba(201,168,76,0.025) 40px,
    rgba(201,168,76,0.025) 41px
  ),
  repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 40px,
    rgba(201,168,76,0.025) 40px,
    rgba(201,168,76,0.025) 41px
  );
  pointer-events: none;
  z-index: 0;
}
.wrapper {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: 0 20px 40px;
  display: flex;
  flex-direction: column;
}
/* デフォルトの並び順 */
.wrapper > header        { order: 1; }
.wrapper > .score-grid   { order: 2; }
.wrapper > .shoe-info    { order: 3; }
.wrapper > .section-controls { order: 4; }
.wrapper > .divider      { order: 5; }
.wrapper > .section-history  { order: 6; }
/* レイアウト反転時：大路を上、操作部を下に */
.wrapper.flipped > .section-history  { order: 4; }
.wrapper.flipped > .section-controls { order: 6; }
/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 0 18px;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dim));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.logo span {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 2px;
  display: block;
  -webkit-text-fill-color: var(--muted);
  color: var(--muted);
  margin-top: -2px;
}
.header-btns { display: flex; gap: 8px; }
#reset-btn, #swap-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 7px 12px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
}
#reset-btn:hover, #swap-btn:hover {
  border-color: var(--gold-dim);
  color: var(--gold);
}
#swap-btn { padding: 7px 11px; font-size: 12px; }
/* ── Score Panel ── */
.score-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin: 24px 0;
}
.score-cell {
  background: var(--surface);
  padding: 14px 10px;
  text-align: center;
}
.score-cell .label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.score-cell .value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 1px;
  color: var(--gold-light);
  line-height: 1;
  transition: transform 0.15s, color 0.2s;
}
.score-cell.highlight .value {
  color: #fff;
}
/* ── Flash Message ── */
#flash-wrap {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 10px 0;
}
#flash {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 52px;
  letter-spacing: 8px;
  opacity: 0;
  transform: scale(0.8) translateY(4px);
  transition: opacity 0.1s, transform 0.1s;
}
#flash.show {
  opacity: 1;
  transform: scale(1) translateY(0);
}
#flash.hit { color: var(--gold-light); text-shadow: 0 0 30px rgba(232,201,122,0.7); }
#flash.miss { color: #e05c5c; text-shadow: 0 0 30px rgba(224,92,92,0.5); }
#flash.tie { color: var(--tie-glow); text-shadow: 0 0 30px rgba(77,232,160,0.5); }
/* ── Buttons ── */
.btn-row {
  display: grid;
  grid-template-columns: 1fr 0.65fr 1fr;
  gap: 12px;
  margin: 8px 0 28px;
}
.bet-btn {
  position: relative;
  background: var(--surface2);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 22px 10px 18px;
  cursor: pointer;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.5);
  overflow: hidden;
  transition: transform 0.12s, border-color 0.2s;
  outline: none;
  -webkit-touch-callout: none;
}
.bet-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.25s;
}
.bet-btn:hover { transform: translateY(-2px); }
.bet-btn:active { transform: scale(0.96); }
/* Player */
.btn-p { border-top: 3px solid var(--player); }
.btn-p::before { background: linear-gradient(160deg, rgba(26,111,168,0.3), transparent 60%); }
.btn-p:hover { border-color: var(--player-glow); color: var(--player-glow); }
.btn-p:hover::before { opacity: 1; }
.btn-p .btn-icon { color: var(--player); }
/* Tie */
.btn-t { border-top: 3px solid var(--tie); }
.btn-t::before { background: linear-gradient(160deg, rgba(30,140,90,0.3), transparent 60%); }
.btn-t:hover { border-color: var(--tie-glow); color: var(--tie-glow); }
.btn-t:hover::before { opacity: 1; }
.btn-t .btn-icon { color: var(--tie); }
/* Banker */
.btn-b { border-top: 3px solid var(--banker); }
.btn-b::before { background: linear-gradient(160deg, rgba(192,57,43,0.3), transparent 60%); }
.btn-b:hover { border-color: var(--banker-glow); color: var(--banker-glow); }
.btn-b:hover::before { opacity: 1; }
.btn-b .btn-icon { color: var(--banker); }
.btn-icon {
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 1px;
  display: block;
  margin-bottom: 6px;
  transition: color 0.2s;
}
.bet-btn span.main {
  display: block;
  position: relative;
  z-index: 1;
}
/* Active press ripple */
.bet-btn.pressed::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.07);
  border-radius: inherit;
  animation: pressFlash 0.3s ease-out forwards;
}
@keyframes pressFlash {
  0% { opacity: 1; }
  100% { opacity: 0; }
}
/* ── Odds display ── */
.odds-row {
  display: grid;
  grid-template-columns: 1fr 0.65fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.odds-chip {
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--muted);
  padding: 4px 0;
}
/* ── History ── */
.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.history-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}
#history-count {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold-dim);
}
/* ── Big Road（大路）─── */
#history {
  --cell: 22px;
  display: grid;
  grid-template-rows: repeat(6, var(--cell));
  grid-auto-flow: column;
  grid-auto-columns: var(--cell);
  gap: 1px;
  padding: 6px;
  background: #08080a;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;
  min-height: calc(var(--cell) * 6 + 14px);
}
#history::-webkit-scrollbar { height: 4px; }
#history::-webkit-scrollbar-track { background: transparent; }
#history::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); border-radius: 2px; }
.br-cell {
  position: relative;
  width: var(--cell);
  height: var(--cell);
  display: flex;
  align-items: center;
  justify-content: center;
}
.br-cell::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 2px solid currentColor;
  background: transparent;
  box-sizing: border-box;
}
.br-b { color: var(--banker); }
.br-p { color: var(--player); }
.br-b::before { box-shadow: 0 0 6px rgba(192,57,43,0.45), inset 0 0 4px rgba(192,57,43,0.25); }
.br-p::before { box-shadow: 0 0 6px rgba(26,111,168,0.45), inset 0 0 4px rgba(26,111,168,0.25); }
.br-cell .tie-slash {
  position: absolute;
  width: 80%;
  height: 2px;
  background: var(--tie-glow);
  transform: rotate(-45deg);
  box-shadow: 0 0 5px rgba(77,232,160,0.6);
  border-radius: 1px;
  z-index: 2;
}
.br-cell .tie-num {
  position: absolute;
  bottom: -1px;
  right: -1px;
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--tie-glow);
  line-height: 1;
  z-index: 3;
  text-shadow: 0 0 3px rgba(0,0,0,0.9);
}
.br-cell.new::before {
  animation: dotPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes dotPop {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.br-empty {
  grid-row: 1 / span 6;
  grid-column: 1 / span 6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold-dim);
  letter-spacing: 4px;
}
/* ── Streak bar ── */
.streak-wrap {
  margin: 20px 0 8px;
}
.streak-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.streak-bar {
  height: 3px;
  background: rgba(255,255,255,0.05);
  border-radius: 2px;
  overflow: hidden;
}
.streak-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold-light));
  transition: width 0.4s cubic-bezier(0.34,1.2,0.64,1);
  box-shadow: 0 0 8px rgba(201,168,76,0.4);
}
/* ── Shoe info ── */
.shoe-info {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  margin: -8px 4px 14px;
  text-transform: uppercase;
  transition: color 0.4s, transform 0.4s;
}
.shoe-info .sep { opacity: 0.3; }
.shoe-info .progress {
  flex: 1;
  height: 2px;
  background: rgba(255,255,255,0.05);
  border-radius: 1px;
  overflow: hidden;
}
.shoe-info .progress > div {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  transition: width 0.3s ease;
}
.shoe-info.flash {
  color: var(--gold-light);
  transform: translateY(-1px);
}
/* ── Divider ── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 20px 0;
}
/* score bump animation */
@keyframes scoreBump {
  0% { transform: scale(1); }
  40% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
.bump { animation: scoreBump 0.3s ease-out; }

/* iPhone notch / safe area additional padding for body */
@supports (padding: max(0px)) {
  .wrapper {
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    padding-bottom: max(40px, env(safe-area-inset-bottom));
  }
}
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="logo">
      Baccarat
      <span>rhythm</span>
    </div>
    <div class="header-btns">
      <button id="swap-btn" onclick="toggleLayout()" title="操作部と大路を入れ替え">⇅</button>
      <button id="reset-btn" onclick="resetGame()">↺ RESET</button>
    </div>
  </header>
  <div class="score-grid">
    <div class="score-cell highlight">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-cell">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>
    <div class="score-cell highlight">
      <div class="label">Combo</div>
      <div class="value" id="combo">0</div>
    </div>
    <div class="score-cell">
      <div class="label">Max</div>
      <div class="value" id="bestCombo">0</div>
    </div>
  </div>
  <div class="shoe-info" id="shoe-info">
    <span>SHOE <span id="shoe-num">1</span></span>
    <span class="sep">·</span>
    <span><span id="shoe-cards">312</span> / 312</span>
    <div class="progress"><div id="shoeFill" style="width:100%"></div></div>
  </div>
  <div class="section-controls">
    <div id="flash-wrap">
      <div id="flash"></div>
    </div>
    <div class="btn-row">
      <button class="bet-btn btn-p" onclick="hit('P')">
        <span class="btn-icon">◈ P L A Y E R</span>
        <span class="main">PLAYER</span>
      </button>
      <button class="bet-btn btn-t" onclick="hit('T')">
        <span class="btn-icon">◈ T I E</span>
        <span class="main">TIE</span>
      </button>
      <button class="bet-btn btn-b" onclick="hit('B')">
        <span class="btn-icon">◈ B A N K E R</span>
        <span class="main">BANKER</span>
      </button>
    </div>
    <div class="odds-row">
      <div class="odds-chip">1 : 1</div>
      <div class="odds-chip">8 : 1</div>
      <div class="odds-chip">1 : 1</div>
    </div>
    <div class="streak-wrap">
      <div class="streak-label">Combo Streak</div>
      <div class="streak-bar"><div class="streak-fill" id="streakFill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="section-history">
    <div class="history-header">
      <div class="history-title">Big Road · 大路</div>
      <div id="history-count">0 rounds</div>
    </div>
    <div id="history"></div>
  </div>
</div>
<script>
let score = 0, combo = 0, history = [], locked = false, current = null;
let best = Number(localStorage.getItem('baccarat_best') || 0);
let bestCombo = Number(localStorage.getItem('baccarat_best_combo') || 0);
const MAX_COMBO_BAR = 10;

// === GoatCounter カスタムイベント ===
function trackEvent(name) {
  if (window.goatcounter && window.goatcounter.count) {
    try { window.goatcounter.count({ path: name, event: true }); } catch(e) {}
  }
}
let firstTapTracked = false;
let install100Tracked = false, install500Tracked = false;
// PWAとして起動されたかを判定して送る（最初の1回だけ）
window.addEventListener('load', () => {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  setTimeout(() => trackEvent(isStandalone ? 'launch-pwa' : 'launch-browser'), 800);
});
// インストール完了イベント（Android Chrome等で発火、iOS非対応）
window.addEventListener('appinstalled', () => trackEvent('pwa-installed'));

// === Bet & payout config ===
const BET = 100;
const PAYOUT = { B: 1, P: 1, T: 8 }; // 1倍 = +100, 8倍 = +800

// === Shoe (6デック=312枚) ===
const NUM_DECKS = 6;
const SHOE_SIZE = NUM_DECKS * 52; // 312
const CUT_THRESHOLD = 14; // 残りこの枚数を下回ったら新シューに（実カジノ準拠）
let shoe = [];
let shoeNumber = 0;

function buildShoe() {
  // バカラのカード値: A=1, 2-9=ピップ, 10/J/Q/K=0
  const deck = [];
  for (let d = 0; d < NUM_DECKS; d++) {
    for (let suit = 0; suit < 4; suit++) {
      deck.push(1);                              // A
      for (let v = 2; v <= 9; v++) deck.push(v); // 2-9
      deck.push(0); deck.push(0); deck.push(0); deck.push(0); // 10,J,Q,K
    }
  }
  // Fisher-Yates シャッフル
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function newShoe(flash = false) {
  shoe = buildShoe();
  shoeNumber++;
  updateShoeUI();
  if (flash) {
    const info = document.getElementById('shoe-info');
    info.classList.add('flash');
    setTimeout(() => info.classList.remove('flash'), 800);
  }
}

function dealHand() {
  // 残り少なければ自動で新シュー
  if (shoe.length < CUT_THRESHOLD) newShoe(true);

  const p1 = shoe.pop(), b1 = shoe.pop();
  const p2 = shoe.pop(), b2 = shoe.pop();
  let pTotal = (p1 + p2) % 10;
  let bTotal = (b1 + b2) % 10;

  // ナチュラル（8 or 9）が出たら追加カードなし
  if (pTotal < 8 && bTotal < 8) {
    let p3 = null;
    // プレイヤー第3カードルール: 0-5でヒット、6-7でスタンド
    if (pTotal <= 5) {
      p3 = shoe.pop();
      pTotal = (pTotal + p3) % 10;
    }
    // バンカー第3カードルール（Tableau）
    if (p3 === null) {
      // プレイヤーがスタンドした場合: バンカーは0-5でヒット
      if (bTotal <= 5) {
        const b3 = shoe.pop();
        bTotal = (bTotal + b3) % 10;
      }
    } else {
      // プレイヤーがヒットした場合: バンカーの合計とp3に応じて判定
      let bDraw = false;
      if (bTotal <= 2) bDraw = true;
      else if (bTotal === 3) bDraw = (p3 !== 8);
      else if (bTotal === 4) bDraw = (p3 >= 2 && p3 <= 7);
      else if (bTotal === 5) bDraw = (p3 >= 4 && p3 <= 7);
      else if (bTotal === 6) bDraw = (p3 === 6 || p3 === 7);
      // bTotal === 7 はスタンド
      if (bDraw) {
        const b3 = shoe.pop();
        bTotal = (bTotal + b3) % 10;
      }
    }
  }

  updateShoeUI();
  if (pTotal > bTotal) return 'P';
  if (bTotal > pTotal) return 'B';
  return 'T';
}

function updateShoeUI() {
  document.getElementById('shoe-num').textContent = shoeNumber;
  document.getElementById('shoe-cards').textContent = shoe.length;
  const pct = (shoe.length / SHOE_SIZE) * 100;
  document.getElementById('shoeFill').style.width = pct + '%';
}

function next() {
  current = dealHand();
  locked = false;
}

function vibrate(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} }
}

// === 連打対応 ===
const COOLDOWN_MS = 200;     // 次のハンドまでの間隔
const QUEUE_MAX = 5;          // ロック中に溜められる入力数
const inputQueue = [];

function hit(input) {
  if (locked) {
    // 処理中はキューに積む（あふれたら破棄）
    if (inputQueue.length < QUEUE_MAX) inputQueue.push(input);
    return;
  }
  if (!current) return;
  if (!firstTapTracked) { firstTapTracked = true; trackEvent('first-tap'); }
  evaluate(input);
}

function evaluate(input) {
  locked = true;
  const btn = document.querySelector(input === 'P' ? '.btn-p' : input === 'T' ? '.btn-t' : '.btn-b');
  // pressed クラスを毎回付け直してアニメーションを再トリガー
  btn.classList.remove('pressed');
  void btn.offsetWidth;
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 200);

  const correct = input === current;
  if (correct) {
    const profit = BET * PAYOUT[current];
    score += profit;
    combo++;
    if (current === 'T') {
      showFlash('+' + profit, 'hit');
      vibrate([0, 25, 30, 25, 30, 40]);
    } else {
      showFlash('HIT', 'hit');
      vibrate(15);
    }
  } else {
    score -= BET;
    combo = 0;
    showFlash('MISS', 'miss');
    vibrate([0, 30, 40, 30]);
  }
  if (score > best) { best = score; localStorage.setItem('baccarat_best', best); }
  if (combo > bestCombo) { bestCombo = combo; localStorage.setItem('baccarat_best_combo', bestCombo); }
  history.push(current);
  // 節目イベント（深いエンゲージメント指標）
  if (!install100Tracked && history.length === 100) { install100Tracked = true; trackEvent('rounds-100'); }
  if (!install500Tracked && history.length === 500) { install500Tracked = true; trackEvent('rounds-500'); }
  update();
  renderHistory();

  setTimeout(() => {
    next();
    // キューに残ってたら即座に次を処理
    if (inputQueue.length > 0 && current) {
      const q = inputQueue.shift();
      evaluate(q);
    }
  }, COOLDOWN_MS);
}
let flashTimer = null;
function showFlash(text, cls) {
  const el = document.getElementById('flash');
  if (flashTimer) clearTimeout(flashTimer);
  el.className = '';
  el.textContent = text;
  void el.offsetWidth;
  el.className = 'show ' + cls;
  flashTimer = setTimeout(() => { el.classList.remove('show'); flashTimer = null; }, 900);
}
function bumpEl(id) {
  const el = document.getElementById(id);
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}
function update() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('combo').textContent = combo;
  document.getElementById('bestCombo').textContent = bestCombo;
  bumpEl('score'); bumpEl('combo');
  const pct = Math.min(combo / MAX_COMBO_BAR * 100, 100);
  document.getElementById('streakFill').style.width = pct + '%';
}
// === Big Road（大路）算出 ===
// 同じ結果が続けば下へ、最下段に到達したら同じ行で右へ（dragon tail = 龍尾）。
// 結果が変わったときは「ストリークが開始した列 + 1」の最上段から新しい列を始める
// （龍尾が右へ伸びていてもジャンプせず、龍尾の上に新しい列を重ねる）。
// TIE は直前の B/P セルに緑のスラッシュとして重ねる。
function buildBigRoad(hist) {
  const ROWS = 6;
  const cells = [];
  const occupied = new Set(); // "row,col"
  let last = null;
  let streakStartCol = 0; // 現在のストリークが始まった列
  let pendingTies = 0;
  const key = (r, c) => r + ',' + c;

  for (const res of hist) {
    if (res === 'T') {
      if (last) last.ties++;
      else pendingTies++;
      continue;
    }
    if (!last) {
      const cell = { row: 0, col: 0, result: res, ties: pendingTies };
      cells.push(cell);
      occupied.add(key(0, 0));
      last = cell;
      streakStartCol = 0;
      pendingTies = 0;
    } else if (last.result === res) {
      // 同じ結果 → まず真下を試す。塞がっていれば同じ行で右へ（龍尾）
      let r = last.row + 1, c = last.col;
      if (r >= ROWS || occupied.has(key(r, c))) {
        r = last.row;
        c = last.col + 1;
        while (occupied.has(key(r, c))) c++;
      }
      const cell = { row: r, col: c, result: res, ties: 0 };
      cells.push(cell);
      occupied.add(key(r, c));
      last = cell;
      // streakStartCol は据え置き
    } else {
      // 結果が変わった → ストリーク開始列の隣（streakStartCol + 1）の最上段
      let r = 0, c = streakStartCol + 1;
      // 万一そこが既に埋まっていれば右へずらす（防御的）
      while (occupied.has(key(r, c))) c++;
      const cell = { row: r, col: c, result: res, ties: 0 };
      cells.push(cell);
      occupied.add(key(r, c));
      last = cell;
      streakStartCol = c;
    }
  }
  return cells;
}

function renderHistory() {
  const el = document.getElementById('history');
  el.innerHTML = '';
  document.getElementById('history-count').textContent = history.length + ' rounds';

  const cells = buildBigRoad(history);
  if (cells.length === 0) {
    const placeholder = document.createElement('div');
    placeholder.className = 'br-empty';
    placeholder.textContent = '— start —';
    el.appendChild(placeholder);
    return;
  }

  cells.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'br-cell br-' + c.result.toLowerCase();
    div.style.gridRow = (c.row + 1);
    div.style.gridColumn = (c.col + 1);
    if (c.ties > 0) {
      const slash = document.createElement('div');
      slash.className = 'tie-slash';
      div.appendChild(slash);
      if (c.ties > 1) {
        const num = document.createElement('div');
        num.className = 'tie-num';
        num.textContent = c.ties;
        div.appendChild(num);
      }
    }
    if (idx === cells.length - 1) div.classList.add('new');
    el.appendChild(div);
  });

  // 右端まで自動スクロール
  requestAnimationFrame(() => { el.scrollLeft = el.scrollWidth; });
}
function resetGame() {
  score = 0; combo = 0; history = []; locked = false; current = null;
  shoeNumber = 0;
  inputQueue.length = 0;
  if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }
  newShoe(false);
  update(); renderHistory();
  document.getElementById('flash').className = '';
  document.getElementById('streakFill').style.width = '0%';
  setTimeout(next, 500);
}
// レイアウト切替
function toggleLayout() {
  const w = document.querySelector('.wrapper');
  w.classList.toggle('flipped');
  localStorage.setItem('baccarat_layout', w.classList.contains('flipped') ? 'flipped' : 'default');
}
// 起動時に前回のレイアウトを復元
if (localStorage.getItem('baccarat_layout') === 'flipped') {
  document.querySelector('.wrapper').classList.add('flipped');
}

update();
newShoe(false);
next();
// PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
// 二重タップでズームを抑止（iOS Safari）
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>
