<script data-goatcounter="https://countb.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
:root {
  --gold: #c9a84c;
  --gold-light: #e8c97a;
  --gold-dim: #7a6230;
  --banker: #c0392b;
  --banker-glow: #ff6b5b;
  --player: #1a6fa8;
  --player-glow: #5ab3f5;
  --tie: #1e8c5a;
  --tie-glow: #4de8a0;
  --bg: #0a0a0c;
  --surface: #111118;
  --surface2: #18181f;
  --border: rgba(201,168,76,0.18);
  --text: #e8e0d0;
  --muted: #8a8070;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  position: relative;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select: none;
  user-select: none;
}
/* Subtle felt texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 20% 100%, rgba(26,111,168,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 60% 80% at 80% 100%, rgba(192,57,43,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}
/* Gold diamond pattern */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 40px,
    rgba(201,168,76,0.025) 40px,
    rgba(201,168,76,0.025) 41px
  ),
  repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 40px,
    rgba(201,168,76,0.025) 40px,
    rgba(201,168,76,0.025) 41px
  );
  pointer-events: none;
  z-index: 0;
}
.wrapper {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: 0 20px 40px;
  display: flex;
  flex-direction: column;
}
/* デフォルトの並び順 */
.wrapper > header        { order: 1; }
.wrapper > .score-grid   { order: 2; }
.wrapper > .shoe-info    { order: 3; }
.wrapper > .section-controls { order: 4; }
.wrapper > .divider      { order: 5; }
.wrapper > .section-history  { order: 6; }
.wrapper > .section-stats    { order: 7; }
/* レイアウト反転時：大路を上、操作部を下に。stats は常に最下部 */
.wrapper.flipped > .section-history  { order: 4; }
.wrapper.flipped > .section-controls { order: 6; }
.wrapper.flipped > .section-stats    { order: 7; }
/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 0 18px;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dim));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.logo span {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  font-weight: 300;
  letter-spacing: 2px;
  display: block;
  -webkit-text-fill-color: var(--muted);
  color: var(--muted);
  margin-top: -2px;
}
.header-btns { display: flex; gap: 8px; }
#reset-btn, #swap-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 7px 12px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
}
#reset-btn:hover, #swap-btn:hover {
  border-color: var(--gold-dim);
  color: var(--gold);
}
#swap-btn { padding: 7px 11px; font-size: 12px; }
/* ── Score Panel ── */
.score-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin: 24px 0;
}
.score-cell {
  background: var(--surface);
  padding: 14px 10px;
  text-align: center;
}
.score-cell .label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.score-cell .value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 1px;
  color: var(--gold-light);
  line-height: 1;
  transition: transform 0.15s, color 0.2s;
}
.score-cell.highlight .value {
  color: #fff;
}
/* ── Flash Message ── */
#flash-wrap {
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 2px 0 4px;
}
#flash {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 34px;
  letter-spacing: 5px;
  line-height: 1;
  opacity: 0;
  transform: scale(0.8) translateY(2px);
  transition: opacity 0.1s, transform 0.1s;
}
#flash.show {
  opacity: 1;
  transform: scale(1) translateY(0);
}
#flash.hit { color: var(--gold-light); text-shadow: 0 0 30px rgba(232,201,122,0.7); }
#flash.miss { color: #e05c5c; text-shadow: 0 0 30px rgba(224,92,92,0.5); }
#flash.tie { color: var(--tie-glow); text-shadow: 0 0 30px rgba(77,232,160,0.5); }
/* ── Buttons ── */
.btn-row {
  display: grid;
  grid-template-columns: 1fr 0.65fr 1fr;
  gap: 12px;
  margin: 8px 0 28px;
}
.bet-btn {
  position: relative;
  background: var(--surface2);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 22px 10px 18px;
  cursor: pointer;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.5);
  overflow: hidden;
  transition: transform 0.12s, border-color 0.2s;
  outline: none;
  -webkit-touch-callout: none;
}
.bet-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.25s;
}
.bet-btn:hover { transform: translateY(-2px); }
.bet-btn:active { transform: scale(0.96); }
/* Player */
.btn-p { border-top: 3px solid var(--player); }
.btn-p::before { background: linear-gradient(160deg, rgba(26,111,168,0.3), transparent 60%); }
.btn-p:hover { border-color: var(--player-glow); color: var(--player-glow); }
.btn-p:hover::before { opacity: 1; }
.btn-p .btn-icon { color: var(--player); }
/* Tie */
.btn-t { border-top: 3px solid var(--tie); }
.btn-t::before { background: linear-gradient(160deg, rgba(30,140,90,0.3), transparent 60%); }
.btn-t:hover { border-color: var(--tie-glow); color: var(--tie-glow); }
.btn-t:hover::before { opacity: 1; }
.btn-t .btn-icon { color: var(--tie); }
/* Banker */
.btn-b { border-top: 3px solid var(--banker); }
.btn-b::before { background: linear-gradient(160deg, rgba(192,57,43,0.3), transparent 60%); }
.btn-b:hover { border-color: var(--banker-glow); color: var(--banker-glow); }
.btn-b:hover::before { opacity: 1; }
.btn-b .btn-icon { color: var(--banker); }
.btn-icon {
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 1px;
  display: block;
  margin-bottom: 6px;
  transition: color 0.2s;
}
.bet-btn span.main {
  display: block;
  position: relative;
  z-index: 1;
}
/* Active press ripple */
.bet-btn.pressed::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.07);
  border-radius: inherit;
  animation: pressFlash 0.3s ease-out forwards;
}
@keyframes pressFlash {
  0% { opacity: 1; }
  100% { opacity: 0; }
}
/* ── Odds display ── */
.odds-row {
  display: grid;
  grid-template-columns: 1fr 0.65fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.odds-chip {
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--muted);
  padding: 4px 0;
}
/* ── History ── */
.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.history-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}
#history-count {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold-dim);
}
/* ── Big Road（大路）─── */
#history {
  --cell: 22px;
  display: grid;
  grid-template-rows: repeat(6, var(--cell));
  grid-auto-flow: column;
  grid-auto-columns: var(--cell);
  gap: 1px;
  padding: 6px;
  background: #08080a;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;
  min-height: calc(var(--cell) * 6 + 14px);
}
#history::-webkit-scrollbar { height: 4px; }
#history::-webkit-scrollbar-track { background: transparent; }
#history::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); border-radius: 2px; }
.br-cell {
  position: relative;
  width: var(--cell);
  height: var(--cell);
  display: flex;
  align-items: center;
  justify-content: center;
}
.br-cell::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 2px solid currentColor;
  background: transparent;
  box-sizing: border-box;
}
.br-b { color: var(--banker); }
.br-p { color: var(--player); }
.br-b::before { box-shadow: 0 0 6px rgba(192,57,43,0.45), inset 0 0 4px rgba(192,57,43,0.25); }
.br-p::before { box-shadow: 0 0 6px rgba(26,111,168,0.45), inset 0 0 4px rgba(26,111,168,0.25); }
.br-cell .tie-slash {
  position: absolute;
  width: 80%;
  height: 2px;
  background: var(--tie-glow);
  transform: rotate(-45deg);
  box-shadow: 0 0 5px rgba(77,232,160,0.6);
  border-radius: 1px;
  z-index: 2;
}
.br-cell .tie-num {
  position: absolute;
  bottom: -1px;
  right: -1px;
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  color: var(--tie-glow);
  line-height: 1;
  z-index: 3;
  text-shadow: 0 0 3px rgba(0,0,0,0.9);
}
.br-cell.new::before {
  animation: dotPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes dotPop {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.br-empty {
  grid-row: 1 / span 6;
  grid-column: 1 / span 6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--gold-dim);
  letter-spacing: 4px;
}
/* ── Bet Wheel ── */
.bet-wheel-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 4px 0 12px;
}
.bet-wheel-container {
  position: relative;
  height: 48px;
  width: 130px;
  overflow: hidden;
}
.bet-wheel-container::before,
.bet-wheel-container::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 14px;
  z-index: 2;
  pointer-events: none;
}
.bet-wheel-container::before {
  top: 0;
  background: linear-gradient(to bottom, var(--bg), transparent);
}
.bet-wheel-container::after {
  bottom: 0;
  background: linear-gradient(to top, var(--bg), transparent);
}
.bet-wheel {
  height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.bet-wheel::-webkit-scrollbar { display: none; }
.bet-wheel-item {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  scroll-snap-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 2px;
  color: var(--muted);
  transition: color 0.2s;
  cursor: pointer;
}
.bet-wheel-item.active { color: var(--gold-light); }
.bet-wheel-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
}
/* ロック状態 */
.bet-wheel-wrap.locked .bet-wheel { pointer-events: none; }
.bet-wheel-wrap.locked .bet-wheel-item { color: rgba(255,255,255,0.15); }
.bet-wheel-wrap.locked .bet-wheel-item.active { color: rgba(255,255,255,0.25); }
.bet-unlock-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.bet-unlock-btn:hover { border-color: var(--gold-dim); }
.bet-unlock-icon { font-size: 14px; }
.bet-unlock-text {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
  white-space: nowrap;
}
.bet-unlock-btn.hidden { display: none; }
/* ── Streak bar ── */
.streak-wrap {
  margin: 20px 0 8px;
}
.streak-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.streak-bar {
  height: 3px;
  background: rgba(255,255,255,0.05);
  border-radius: 2px;
  overflow: hidden;
}
.streak-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold-light));
  transition: width 0.4s cubic-bezier(0.34,1.2,0.64,1);
  box-shadow: 0 0 8px rgba(201,168,76,0.4);
}
/* ── Shoe info ── */
.shoe-info {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  margin: -8px 4px 14px;
  text-transform: uppercase;
  transition: color 0.4s, transform 0.4s;
}
.shoe-info .sep { opacity: 0.3; }
.shoe-info .progress {
  flex: 1;
  height: 2px;
  background: rgba(255,255,255,0.05);
  border-radius: 1px;
  overflow: hidden;
}
.shoe-info .progress > div {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dim), var(--gold));
  transition: width 0.3s ease;
}
.shoe-info.flash {
  color: var(--gold-light);
  transform: translateY(-1px);
}
/* ── Divider ── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 20px 0;
}
/* score bump animation */
@keyframes scoreBump {
  0% { transform: scale(1); }
  40% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
.bump { animation: scoreBump 0.3s ease-out; }

/* ── 画面振動（NEW SHOE等のインパクト演出） ── */
@keyframes screenShake {
  0%   { transform: translate3d(0, 0, 0); }
  8%   { transform: translate3d(-7px, -3px, 0); }
  17%  { transform: translate3d(8px, 4px, 0); }
  25%  { transform: translate3d(-6px, 5px, 0); }
  33%  { transform: translate3d(7px, -4px, 0); }
  42%  { transform: translate3d(-5px, 4px, 0); }
  50%  { transform: translate3d(4px, -3px, 0); }
  58%  { transform: translate3d(-4px, 2px, 0); }
  67%  { transform: translate3d(3px, -2px, 0); }
  75%  { transform: translate3d(-2px, 1px, 0); }
  83%  { transform: translate3d(2px, -1px, 0); }
  92%  { transform: translate3d(-1px, 1px, 0); }
  100% { transform: translate3d(0, 0, 0); }
}
body.shake { animation: screenShake 0.55s ease-out; }
@media (prefers-reduced-motion: reduce) {
  body.shake { animation: none; }
}

/* ── New Shoe バナー ── */
#shoe-banner {
  position: fixed;
  top: 38%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.85);
  z-index: 200;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.35s cubic-bezier(0.34,1.2,0.64,1),
              transform 0.45s cubic-bezier(0.34,1.4,0.64,1);
  text-align: center;
  padding: 22px 44px 18px;
  background: linear-gradient(135deg, rgba(15,15,20,0.92), rgba(28,22,12,0.92));
  border: 1px solid var(--gold);
  border-radius: 10px;
  box-shadow:
    0 0 0 1px rgba(232,201,122,0.15),
    0 16px 50px rgba(0,0,0,0.6),
    0 0 70px rgba(201,168,76,0.35);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
#shoe-banner.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
#shoe-banner .sb-main {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 46px;
  letter-spacing: 10px;
  background: linear-gradient(135deg, #fff5d6 10%, var(--gold-light) 40%, var(--gold) 70%, var(--gold-dim));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  text-shadow: 0 0 30px rgba(232,201,122,0.4);
  padding-right: 10px; /* offset letter-spacing */
}
#shoe-banner .sb-sub {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--muted);
  margin-top: 10px;
  text-transform: uppercase;
}
#shoe-banner .sb-sub b {
  color: var(--gold-light);
  font-weight: 400;
  margin: 0 4px;
}
/* バナー下のかすかなライン演出 */
#shoe-banner::before {
  content: '';
  position: absolute;
  left: 20%;
  right: 20%;
  bottom: 8px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
  opacity: 0.6;
}

/* ── Stats section（投票履歴・点数推移） ── */
.section-stats { margin-top: 22px; }
.stats-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;

<script>
let score = 0, combo = 0, history = [], locked = false, current = null;
let userHistory = []; // {bet, result, outcome, delta, total}
let best = Number(localStorage.getItem('baccarat_best') || 0);
let bestCombo = Number(localStorage.getItem('baccarat_best_combo') || 0);
const MAX_COMBO_BAR = 10;
let lastPTotal = null, lastBTotal = null;

// === GoatCounter カスタムイベント ===
function trackEvent(name) {
  if (window.goatcounter && window.goatcounter.count) {
    try { window.goatcounter.count({ path: name, event: true }); } catch(e) {}
  }
}
let firstTapTracked = false;
let install100Tracked = false, install500Tracked = false;
// PWAとして起動されたかを判定して送る（最初の1回だけ）
window.addEventListener('load', () => {
  loadAd();
  initBetWheel();
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  setTimeout(() => trackEvent(isStandalone ? 'launch-pwa' : 'launch-browser'), 800);
});
// インストール完了イベント（Android Chrome等で発火、iOS非対応）
window.addEventListener('appinstalled', () => trackEvent('pwa-installed'));

// === Bet & payout config ===
let currentBet = 100;
const BET_OPTIONS = [100, 200, 300, 400, 500];
const PAYOUT = { B: 1, P: 1, T: 8 }; // 1倍 = +100, 8倍 = +800

// === Bet Wheel ===
const UNLOCK_DELAY_MS = 24 * 60 * 60 * 1000; // 24時間
let betUnlocked = localStorage.getItem('bet_unlocked') === 'true';

function initBetWheel() {
  const wheel = document.getElementById('bet-wheel');
  const wrap = document.getElementById('bet-wheel-wrap');
  const unlockBtn = document.getElementById('bet-unlock-btn');

  // シェア済みで24時間経過していればアンロック
  if (!betUnlocked) {
    const shareTime = Number(localStorage.getItem('bet_share_time') || 0);
    if (shareTime && Date.now() - shareTime >= UNLOCK_DELAY_MS) {
      betUnlocked = true;
      localStorage.setItem('bet_unlocked', 'true');
    }
  }

  if (betUnlocked) {
    wrap.classList.remove('locked');
    unlockBtn.classList.add('hidden');
  }

  wheel.addEventListener('scroll', () => {
    const itemH = 48;
    const idx = Math.round(wheel.scrollTop / itemH);
    const realIdx = Math.min(Math.max(idx, 0), BET_OPTIONS.length - 1);
    currentBet = BET_OPTIONS[realIdx];
    document.querySelectorAll('.bet-wheel-item').forEach((el, i) => {
      el.classList.toggle('active', i === realIdx + 1);
    });
  }, { passive: true });

  wheel.scrollTop = 0;
}

function shareCountdown() {
  const shareTime = Number(localStorage.getItem('bet_share_time') || 0);
  const remaining = UNLOCK_DELAY_MS - (Date.now() - shareTime);
  const h = Math.floor(remaining / 3600000);
  const m = Math.floor((remaining % 3600000) / 60000);
  return `あと ${h}時間${m}分`;
}

function showUnlockOptions() {
  const shareTime = Number(localStorage.getItem('bet_share_time') || 0);
  const alreadyShared = shareTime > 0;
  const shareReady = alreadyShared && Date.now() - shareTime >= UNLOCK_DELAY_MS;

  let shareBlock = '';
  if (shareReady) {
    shareBlock = `<button onclick="unlockBetWheel();document.getElementById('unlock-sheet').remove()" style="
      width:100%;padding:16px;margin-bottom:12px;
      background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.5);
      border-radius:10px;color:#e8c97a;font-family:'DM Mono',monospace;
      font-size:11px;letter-spacing:2px;cursor:pointer;
    ">🔓 アンロック可能！タップして解除</button>`;
  } else if (alreadyShared) {
    shareBlock = `<div style="
      width:100%;padding:16px;margin-bottom:12px;box-sizing:border-box;
      background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;text-align:center;
      font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;color:#8a8070;
    ">⏳ シェア済み — ${shareCountdown()}</div>`;
  } else {
    shareBlock = `<button onclick="unlockByShare()" style="
      width:100%;padding:16px;margin-bottom:12px;
      background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.3);
      border-radius:10px;color:#e8c97a;font-family:'DM Mono',monospace;
      font-size:11px;letter-spacing:2px;cursor:pointer;
    ">📤 アプリをシェア → 24時間後にアンロック</button>`;
  }

  const sheet = document.createElement('div');
  sheet.id = 'unlock-sheet';
  sheet.style.cssText = `
    position:fixed;inset:0;z-index:9999;
    background:rgba(0,0,0,0.75);
    display:flex;align-items:flex-end;justify-content:center;
  `;
  sheet.innerHTML = `
    <div style="
      background:#18181f;border-radius:18px 18px 0 0;
      padding:28px 24px 40px;width:100%;max-width:520px;
      border-top:1px solid rgba(201,168,76,0.2);
    ">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:#e8c97a;margin-bottom:6px;">UNLOCK BET WHEEL</div>
      <div style="font-family:'DM Mono',monospace;font-size:10px;color:#8a8070;letter-spacing:1px;margin-bottom:24px;">ベット額変更をアンロックする方法を選んでください</div>
      ${shareBlock}
      <button onclick="checkAchievementUnlock()" style="
        width:100%;padding:16px;margin-bottom:20px;
        background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.3);
        border-radius:10px;color:#e8c97a;font-family:'DM Mono',monospace;
        font-size:11px;letter-spacing:2px;cursor:pointer;
      ">🏆 コンボ10達成 or シュー3回でアンロック</button>
      <button onclick="document.getElementById('unlock-sheet').remove()" style="
        width:100%;padding:12px;
        background:transparent;border:1px solid rgba(255,255,255,0.1);
        border-radius:10px;color:#8a8070;font-family:'DM Mono',monospace;
        font-size:10px;letter-spacing:2px;cursor:pointer;
      ">キャンセル</button>
    </div>
  `;
  document.body.appendChild(sheet);
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.remove(); });
}

function unlockByShare() {
  const doShare = () => {
    localStorage.setItem('bet_share_time', Date.now().toString());
    document.getElementById('unlock-sheet')?.remove();
    // シートを再描画してカウントダウン表示
    showUnlockOptions();
  };
  if (navigator.share) {
    navigator.share({
      title: 'Baccarat Rhythm',
      text: '6デッキのリアルなシューでバカラの流れを読む練習ができるアプリ。無料・インストール不要。',
      url: 'https://iminonai.com'
    }).then(doShare).catch(() => {});
  } else {
    navigator.clipboard?.writeText('https://iminonai.com').then(doShare);
  }
}

function checkAchievementUnlock() {
  const sheet = document.getElementById('unlock-sheet');
  if (bestCombo >= 10 || shoeNumber >= 3) {
    sheet?.remove();
    unlockBetWheel();
  } else {
    const remaining = [];
    if (bestCombo < 10) remaining.push(`コンボ ${bestCombo}/10`);
    if (shoeNumber < 3) remaining.push(`シュー ${shoeNumber}/3`);
    alert('まだ条件を達成していません\n' + remaining.join('  /  '));
  }
}

function unlockBetWheel() {
  betUnlocked = true;
  localStorage.setItem('bet_unlocked', 'true');
  const wrap = document.getElementById('bet-wheel-wrap');
  const unlockBtn = document.getElementById('bet-unlock-btn');
  wrap.classList.remove('locked');
  unlockBtn.classList.add('hidden');
  wrap.style.transition = 'opacity 0.3s';
  wrap.style.opacity = '0.4';
  setTimeout(() => { wrap.style.opacity = '1'; }, 300);
  if (typeof trackEvent === 'function') trackEvent('bet-unlocked');
}

// === Shoe (6デック=312枚) ===
const NUM_DECKS = 6;
const SHOE_SIZE = NUM_DECKS * 52; // 312
const CUT_THRESHOLD = 14; // 残りこの枚数を下回ったら新シューに（実カジノ準拠）
let shoe = [];
let shoeNumber = 0;

function buildShoe() {
  // バカラのカード値: A=1, 2-9=ピップ, 10/J/Q/K=0
  const deck = [];
  for (let d = 0; d < NUM_DECKS; d++) {
    for (let suit = 0; suit < 4; suit++) {
      deck.push(1);                              // A
      for (let v = 2; v <= 9; v++) deck.push(v); // 2-9
      deck.push(0); deck.push(0); deck.push(0); deck.push(0); // 10,J,Q,K
    }
  }
  // Fisher-Yates シャッフル
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function newShoe(flash = false) {
  shoe = buildShoe();
  shoeNumber++;
  updateShoeUI();
  if (flash) {
    const info = document.getElementById('shoe-info');
    info.classList.add('flash');
    setTimeout(() => info.classList.remove('flash'), 800);
    showShoeBanner();
    if (typeof trackEvent === 'function') trackEvent('new-shoe');
    loadAd();
  }
}

function loadAd() {
  const container = document.getElementById('ad-banner');
  if (!container) return;
  container.innerHTML = '';
  const s = document.createElement('script');
  s.dataset.zone = '11035792';
  s.src = 'https://nap5k.com/tag.min.js';
  container.appendChild(s);
}

let shoeBannerTimer = null;
let shakeTimer = null;
function shakeScreen() {
  const b = document.body;
  if (shakeTimer) clearTimeout(shakeTimer);
  b.classList.remove('shake');
  void b.offsetWidth;
  b.classList.add('shake');
  shakeTimer = setTimeout(() => {
    b.classList.remove('shake');
    shakeTimer = null;
  }, 600);
}
function showShoeBanner() {
  const el = document.getElementById('shoe-banner');
  document.getElementById('sb-num').textContent = shoeNumber;
  if (shoeBannerTimer) clearTimeout(shoeBannerTimer);
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  shakeScreen();
  vibrate([0, 30, 60, 30, 60, 50]); // 振動対応端末向け（iOSは無視される）
  shoeBannerTimer = setTimeout(() => {
    el.classList.remove('show');
    shoeBannerTimer = null;
  }, 1500);
}

function dealHand() {
  // 残り少なければ自動で新シュー
  if (shoe.length < CUT_THRESHOLD) newShoe(true);

  const p1 = shoe.pop(), b1 = shoe.pop();
  const p2 = shoe.pop(), b2 = shoe.pop();
  let pTotal = (p1 + p2) % 10;
  let bTotal = (b1 + b2) % 10;

  // ナチュラル（8 or 9）が出たら追加カードなし
  if (pTotal < 8 && bTotal < 8) {
    let p3 = null;
    // プレイヤー第3カードルール: 0-5でヒット、6-7でスタンド
    if (pTotal <= 5) {
      p3 = shoe.pop();
      pTotal = (pTotal + p3) % 10;
    }
    // バンカー第3カードルール（Tableau）
    if (p3 === null) {
      // プレイヤーがスタンドした場合: バンカーは0-5でヒット
      if (bTotal <= 5) {
        const b3 = shoe.pop();
        bTotal = (bTotal + b3) % 10;
      }
    } else {
      // プレイヤーがヒットした場合: バンカーの合計とp3に応じて判定
      let bDraw = false;
      if (bTotal <= 2) bDraw = true;
      else if (bTotal === 3) bDraw = (p3 !== 8);
      else if (bTotal === 4) bDraw = (p3 >= 2 && p3 <= 7);
      else if (bTotal === 5) bDraw = (p3 >= 4 && p3 <= 7);
      else if (bTotal === 6) bDraw = (p3 === 6 || p3 === 7);
      // bTotal === 7 はスタンド
      if (bDraw) {
        const b3 = shoe.pop();
        bTotal = (bTotal + b3) % 10;
      }
    }
  }

  updateShoeUI();
  const winner = pTotal > bTotal ? 'P' : bTotal > pTotal ? 'B' : 'T';
  return { winner, pTotal, bTotal };
}

function updateShoeUI() {
  document.getElementById('shoe-num').textContent = shoeNumber;
  document.getElementById('shoe-cards').textContent = shoe.length;
  const pct = (shoe.length / SHOE_SIZE) * 100;
  document.getElementById('shoeFill').style.width = pct + '%';
}

function next() {
  const result = dealHand();
  current = result.winner;
  lastPTotal = result.pTotal;
  lastBTotal = result.bTotal;
  locked = false;
}

function vibrate(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} }
}

// === 連打対応 ===
const COOLDOWN_MS = 200;     // 次のハンドまでの間隔
const QUEUE_MAX = 5;          // ロック中に溜められる入力数
const inputQueue = [];

function hit(input) {
  if (locked) {
    // 処理中はキューに積む（あふれたら破棄）
    if (inputQueue.length < QUEUE_MAX) inputQueue.push(input);
    return;
  }
  if (!current) return;
  if (!firstTapTracked) { firstTapTracked = true; trackEvent('first-tap'); }
  evaluate(input);
}

function evaluate(input) {
  locked = true;
  const btn = document.querySelector(input === 'P' ? '.btn-p' : input === 'T' ? '.btn-t' : '.btn-b');
  // pressed クラスを毎回付け直してアニメーションを再トリガー
  btn.classList.remove('pressed');
  void btn.offsetWidth;
  btn.classList.add('pressed');
  setTimeout(() => btn.classList.remove('pressed'), 200);

  let outcome, delta;
  if (input === current) {
    // 当たり: ベット額 × 倍率
    delta = currentBet * PAYOUT[current];
    outcome = 'HIT';
    score += delta;
    combo++;
    if (current === 'T') {
      showFlash('+' + delta, 'hit');
      vibrate([0, 25, 30, 25, 30, 40]);
    } else {
      showFlash('HIT', 'hit');
      vibrate(15);
    }
  } else if (current === 'T' && (input === 'P' || input === 'B')) {
    // プッシュ: P/Bに賭けてTie結果が出た → 賭け金返却。スコア変動なし、コンボは維持
    delta = 0;
    outcome = 'PUSH';
    showFlash('PUSH', 'tie');
    vibrate(20);
  } else {
    // 外れ: ベット額没収
    delta = -currentBet;
    outcome = 'MISS';
    score += delta;
    combo = 0;
    showFlash('MISS', 'miss');
    vibrate([0, 30, 40, 30]);
  }
  showBtnScores(lastPTotal, lastBTotal);
  if (score > best) { best = score; localStorage.setItem('baccarat_best', best); }
  if (combo > bestCombo) { bestCombo = combo; localStorage.setItem('baccarat_best_combo', bestCombo); }
  history.push(current);
  userHistory.push({ bet: input, result: current, outcome, delta, total: score });
  // 節目イベント（深いエンゲージメント指標）
  if (!install100Tracked && history.length === 100) { install100Tracked = true; trackEvent('rounds-100'); }
  if (!install500Tracked && history.length === 500) { install500Tracked = true; trackEvent('rounds-500'); }
  update();
  renderHistory();
  renderStats();

  setTimeout(() => {
    next();
    // キューに残ってたら即座に次を処理
    if (inputQueue.length > 0 && current) {
      const q = inputQueue.shift();
      evaluate(q);
    }
  }, COOLDOWN_MS);
}
let scoreTimer = null;
function showBtnScores(p, b) {
  const elP = document.getElementById('score-p');
  const elB = document.getElementById('score-b');
  if (scoreTimer) clearTimeout(scoreTimer);
  elP.textContent = p;
  elB.textContent = b;
  elP.classList.remove('show');
  elB.classList.remove('show');
  void elP.offsetWidth;
  elP.classList.add('show');
  elB.classList.add('show');
  scoreTimer = setTimeout(() => {
    elP.classList.remove('show');
    elB.classList.remove('show');
    scoreTimer = null;
  }, 900);
}
let flashTimer = null;
function showFlash(text, cls) {
  const el = document.getElementById('flash');
  if (flashTimer) clearTimeout(flashTimer);
  el.className = '';
  el.textContent = text;
  void el.offsetWidth;
  el.className = 'show ' + cls;
  flashTimer = setTimeout(() => { el.classList.remove('show'); flashTimer = null; }, 900);
}
function bumpEl(id) {
  const el = document.getElementById(id);
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}
function update() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('combo').textContent = combo;
  document.getElementById('bestCombo').textContent = bestCombo;
  bumpEl('score'); bumpEl('combo');
  const pct = Math.min(combo / MAX_COMBO_BAR * 100, 100);
  document.getElementById('streakFill').style.width = pct + '%';
}
// === Big Road（大路）算出 ===
// 同じ結果が続けば下へ、最下段に到達したら同じ行で右へ（dragon tail = 龍尾）。
// 結果が変わったときは「ストリークが開始した列 + 1」の最上段から新しい列を始める
// （龍尾が右へ伸びていてもジャンプせず、龍尾の上に新しい列を重ねる）。
// TIE は直前の B/P セルに緑のスラッシュとして重ねる。
function buildBigRoad(hist) {
  const ROWS = 6;
  const cells = [];
  const occupied = new Set(); // "row,col"
  let last = null;
  let streakStartCol = 0; // 現在のストリークが始まった列
  let pendingTies = 0;
  const key = (r, c) => r + ',' + c;

  for (const res of hist) {
    if (res === 'T') {
      if (last) last.ties++;
      else pendingTies++;
      continue;
    }
    if (!last) {
      const cell = { row: 0, col: 0, result: res, ties: pendingTies };
      cells.push(cell);
      occupied.add(key(0, 0));
      last = cell;
      streakStartCol = 0;
      pendingTies = 0;
    } else if (last.result === res) {
      // 同じ結果 → まず真下を試す。塞がっていれば同じ行で右へ（龍尾）
      let r = last.row + 1, c = last.col;
      if (r >= ROWS || occupied.has(key(r, c))) {
        r = last.row;
        c = last.col + 1;
        while (occupied.has(key(r, c))) c++;
      }
      const cell = { row: r, col: c, result: res, ties: 0 };
      cells.push(cell);
      occupied.add(key(r, c));
      last = cell;
      // streakStartCol は据え置き
    } else {
      // 結果が変わった → ストリーク開始列の隣（streakStartCol + 1）の最上段
      let r = 0, c = streakStartCol + 1;
      // 万一そこが既に埋まっていれば右へずらす（防御的）
      while (occupied.has(key(r, c))) c++;
      const cell = { row: r, col: c, result: res, ties: 0 };
      cells.push(cell);
      occupied.add(key(r, c));
      last = cell;
      streakStartCol = c;
    }
  }
  return cells;
}

function renderHistory() {
  const el = document.getElementById('history');
  el.innerHTML = '';
  document.getElementById('history-count').textContent = history.length + ' rounds';

  const cells = buildBigRoad(history);
  if (cells.length === 0) {
    const placeholder = document.createElement('div');
    placeholder.className = 'br-empty';
    placeholder.textContent = '— start —';
    el.appendChild(placeholder);
    return;
  }

  cells.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'br-cell br-' + c.result.toLowerCase();
    div.style.gridRow = (c.row + 1);
    div.style.gridColumn = (c.col + 1);
    if (c.ties > 0) {
      const slash = document.createElement('div');
      slash.className = 'tie-slash';
      div.appendChild(slash);
      if (c.ties > 1) {
        const num = document.createElement('div');
        num.className = 'tie-num';
        num.textContent = c.ties;
        div.appendChild(num);
      }
    }
    if (idx === cells.length - 1) div.classList.add('new');
    el.appendChild(div);
  });

  // 右端まで自動スクロール
  requestAnimationFrame(() => { el.scrollLeft = el.scrollWidth; });
}
// === 投票履歴・点数推移の描画 ===
function renderStats() {
  renderBetList();
  renderScoreChart();
  renderChartStats();
}

function renderBetList() {
  const el = document.getElementById('bet-list');
  document.getElementById('hist-rounds').textContent = userHistory.length + ' rounds';
  if (userHistory.length === 0) {
    el.innerHTML = '<div class="bet-list-empty">— start —</div>';
    return;
  }
  // 直近200ラウンドだけ描画（古いのは見たければスクロール、ただし軽量化のためカット）
  const showFrom = Math.max(0, userHistory.length - 200);
  el.innerHTML = '';
  const glyph = { HIT: '▲', MISS: '✕', PUSH: '≈' };
  for (let i = showFrom; i < userHistory.length; i++) {
    const d = userHistory[i];
    const row = document.createElement('div');
    row.className = 'hist-row';
    if (i === userHistory.length - 1) row.classList.add('new');

    const round = document.createElement('span');
    round.className = 'hist-round';
    round.textContent = '#' + (i + 1);

    const bet = document.createElement('span');
    bet.className = 'hist-bet b-' + d.bet.toLowerCase();
    bet.textContent = d.bet;

    const arrow = document.createElement('span');
    arrow.className = 'hist-arrow';
    arrow.textContent = '→';

    const result = document.createElement('span');
    result.className = 'hist-result r-' + d.outcome.toLowerCase();
    result.textContent = glyph[d.outcome];

    const delta = document.createElement('span');
    let cls = 'hist-delta ';
    if (d.delta > 0) cls += 'd-gain';
    else if (d.delta < 0) cls += 'd-loss';
    else cls += 'd-push';
    delta.className = cls;
    delta.textContent = d.delta === 0 ? '±0' : (d.delta > 0 ? '+' : '') + d.delta;

    row.append(round, bet, arrow, result, delta);
    el.appendChild(row);
  }
  // 最新が下端 → 最下部までスクロール
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function renderScoreChart() {
  const W = 320, H = 100, padX = 6, padY = 8;
  const drawW = W - padX * 2;
  const drawH = H - padY * 2;
  const fillEl = document.getElementById('score-fill');
  const lineEl = document.getElementById('score-line');
  const zeroEl = document.getElementById('score-zero');
  const trendEl = document.getElementById('trend-current');

  if (userHistory.length === 0) {
    fillEl.setAttribute('points', '');
    lineEl.setAttribute('points', '');
    const baseY = (padY + drawH).toFixed(1);
    zeroEl.setAttribute('y1', baseY);
    zeroEl.setAttribute('y2', baseY);
    trendEl.textContent = '0';
    trendEl.classList.remove('neg');
    return;
  }
  // 折れ線は直近120ラウンドだけ表示（圧縮しすぎず読めるように）
  const data = userHistory.slice(-120);
  const scores = data.map(d => d.total);
  const minS = Math.min(0, ...scores);
  const maxS = Math.max(0, ...scores);
  const range = (maxS - minS) || 100;

  const xs = data.map((_, i) => padX + (data.length === 1 ? drawW / 2 : (i / (data.length - 1)) * drawW));
  const ys = data.map(d => padY + drawH - ((d.total - minS) / range) * drawH);
  const points = xs.map((x, i) => x.toFixed(1) + ',' + ys[i].toFixed(1)).join(' ');
  const baseY = padY + drawH - ((0 - minS) / range) * drawH;
  const fillPoints = xs[0].toFixed(1) + ',' + baseY.toFixed(1) + ' ' + points + ' ' + xs[xs.length - 1].toFixed(1) + ',' + baseY.toFixed(1);

  lineEl.setAttribute('points', points);
  fillEl.setAttribute('points', fillPoints);
  zeroEl.setAttribute('y1', baseY.toFixed(1));
  zeroEl.setAttribute('y2', baseY.toFixed(1));

  const cur = scores[scores.length - 1];
  trendEl.textContent = (cur > 0 ? '+' : '') + cur.toLocaleString();
  trendEl.classList.toggle('neg', cur < 0);
}

function renderChartStats() {
  const total = userHistory.length;
  const hits = userHistory.filter(d => d.outcome === 'HIT').length;
  const max = userHistory.length ? Math.max(0, ...userHistory.map(d => d.total)) : 0;
  const min = userHistory.length ? Math.min(0, ...userHistory.map(d => d.total)) : 0;
  document.getElementById('stat-hit').textContent = hits;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-max').textContent = (max > 0 ? '+' : '') + max.toLocaleString();
  document.getElementById('stat-min').textContent = min < 0 ? min.toLocaleString() : '0';
}

function resetGame() {
  score = 0; combo = 0; history = []; locked = false; current = null;
  userHistory = [];
  shoeNumber = 0;
  inputQueue.length = 0;
  if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }
  if (scoreTimer) { clearTimeout(scoreTimer); scoreTimer = null; }
  document.getElementById('score-p').classList.remove('show');
  document.getElementById('score-b').classList.remove('show');
  newShoe(false);
  update(); renderHistory(); renderStats();
  document.getElementById('flash').className = '';
  document.getElementById('streakFill').style.width = '0%';
  setTimeout(next, 500);
}
// レイアウト切替
function toggleLayout() {
  const w = document.querySelector('.wrapper');
  w.classList.toggle('flipped');
  localStorage.setItem('baccarat_layout', w.classList.contains('flipped') ? 'flipped' : 'default');
}
// 起動時に前回のレイアウトを復元
if (localStorage.getItem('baccarat_layout') === 'flipped') {
  document.querySelector('.wrapper').classList.add('flipped');
}

update();
newShoe(false);
renderStats();
next();
// PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
// 二重タップでズームを抑止（iOS Safari）
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>
